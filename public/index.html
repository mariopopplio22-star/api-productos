<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Express NodeJS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
    
  </head>

  <body>
    <div class="container py-4">
      <h1>Mantenimiento de productos</h1>

      <div id="mensaje" class="mb-3"></div>

      <!-- Columnas [FORMULARIO - TABLA] -->
      <div class="row g-4">
        <!-- FORMULARIO -->
        <div class="col-12 col-md-4">
          <div class="card">
            <div class="card-header" id="tituloFormulario">Nuevo producto</div>

            <div class="card-body">
              <form id="formProducto">
                <!-- Campo oculto -->
                <input type="hidden" id="id" />

                <div class="mb-3">
                  <label for="marca" class="form-label"> Marca </label>
                  <input type="text" id="marca" class="form-control" required />
                </div>

                <div class="mb-3">
                  <label for="descripcion" class="form-label">
                    Descripción
                  </label>
                  <input
                    type="text"
                    id="descripcion"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="precio" class="form-label"> Precio </label>
                  <input
                    type="number"
                    id="precio"
                    class="form-control"
                    min="0"
                    step="0.01"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="stock" class="form-label"> Stock </label>
                  <input
                    type="number"
                    min="0"
                    value="1"
                    id="stock"
                    class="form-control"
                    required
                  />
                </div>

                <div>
                  <button type="submit" class="btn btn-primary">Guardar</button>

                  <button type="reset" class="btn btn-secondary">
                    Cancelar
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- TABLA -->
        <div class="col-12 col-md-8">
          <!-- Buscador -->
          <form id="formBuscar" class="d-flex gap-2 mb-3">
            <input
              type="text"
              id="buscarId"
              class="form-control"
              placeholder="Escriba el ID"
              required
            />

            <button type="submit" class="btn btn-secondary">Buscar</button>

            <button type="button" class="btn btn-secondary">Ver todos</button>
          </form>

          <!-- Tabla -->
          <div class="table-responsive">
            <table class="table table-striped table-hover">
              <thead>
                <tr>
                  <th>Id</th>
                  <th>Marca</th>
                  <th>Descripción</th>
                  <th>Precio</th>
                  <th>Stock</th>
                  <th>Acciones</th>
                </tr>
              </thead>

              <tbody id="cuerpoTabla">
                <!-- Aquí se mostrarán los productos -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.min.js" integrity="sha384-3Yo3YCoxUQZoPH8he5dQIEAZ/k/vBTLYf1CFU5hE7GYPzQZu3dYpWvBwWKxN+HJZ" crossorigin="anonymous"></script>

    <script src="./js/productos.js"></script>
  </body>
</html>
